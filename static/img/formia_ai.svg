<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24"/>
      <stop offset="50%" stop-color="#141c3a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Glowing Orbs in background -->
  <circle cx="200" cy="180" r="140" fill="#6366f1" fill-opacity="0.18" filter="url(#glow)"/>
  <circle cx="620" cy="320" r="130" fill="#ec4899" fill-opacity="0.14" filter="url(#glow)"/>

  <!-- AI Brain / Network Graphic -->
  <g transform="translate(400, 210)">
    <!-- Central Hexagon / Core -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="22" fill="url(#accentGrad)"/>
    
    <!-- Nodes and Connections -->
    <line x1="0" y1="-60" x2="0" y2="-100" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="0" cy="-100" r="7" fill="#06b6d4"/>
    
    <line x1="52" y1="-30" x2="110" y2="-60" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="110" cy="-60" r="8" fill="#8b5cf6"/>

    <line x1="52" y1="30" x2="120" y2="40" stroke="#ec4899" stroke-width="2"/>
    <circle cx="120" cy="40" r="7" fill="#ec4899"/>

    <line x1="0" y1="60" x2="0" y2="95" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="0" cy="95" r="7" fill="#3b82f6"/>

    <line x1="-52" y1="30" x2="-115" y2="50" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="-115" cy="50" r="7" fill="#06b6d4"/>

    <line x1="-52" y1="-30" x2="-110" y2="-60" stroke="#a855f7" stroke-width="2"/>
    <circle cx="-110" cy="-60" r="8" fill="#a855f7"/>

    <!-- Form Cards Icons Left and Right -->
    <rect x="-240" y="-55" width="85" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="-225" y1="-30" x2="-175" y2="-30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-225" y1="-10" x2="-190" y2="-10" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-225" y1="10" x2="-170" y2="10" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="-225" y1="30" x2="-180" y2="30" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="155" y="-55" width="85" height="110" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="170" y1="-30" x2="220" y2="-30" stroke="#ec4899" stroke-width="3" stroke-linecap="round"/>
    <line x1="170" y1="-10" x2="205" y2="-10" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="170" y1="10" x2="225" y2="10" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="170" y1="30" x2="210" y2="30" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Titles -->
  <text x="400" y="375" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="2">
    FormIA
  </text>
  <text x="400" y="410" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="1">
    AI-Powered Dynamic Form Engine &amp; Intelligent Assistant
  </text>
  <text x="400" y="440" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" font-weight="600" fill="#06b6d4" letter-spacing="1.5">
    FLASK &bull; OLLAMA QWEN2.5 &bull; MYSQL &bull; FAKER
  </text>
</svg>
