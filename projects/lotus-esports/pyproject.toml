[project]
name = "lotus"
version = "1.0.4"
description = "Lotus - Gaming & eSports Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flet>=0.86.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
desktop = ["flet[desktop]>=0.86.0"]
server = [
    "mysql-connector-python>=9.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[tool.flet]
org = "gg.lotus"
product = "Lotus"
company = "Lotus eSports"
copyright = "Copyright (C) 2026 Lotus eSports"

[tool.flet.app]
path = "."

[tool.flet.android]
bundle_id = "gg.lotus.app"
product = "Lotus"
adaptive_icon_background = "#090D1A"
icon_background = "#090D1A"
splash_color = "#090D1A"
permissions = ["internet"]
